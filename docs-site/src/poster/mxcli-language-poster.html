      li.querySelector('input').checked = shown;
      li.onclick = function(e){ if (e.target.closest('input,button')) return; var i = seq.indexOf(s); if (i >= 0) go(i); };
      li.ondragstart = function(e){ dragId = id; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(id)); } catch (x) {} };

  }
  function slug(t){ return (t || '').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'presentation'; }

  function saveCopy(){

    [].forEach.call(doc.querySelectorAll('.sd-hidden'), function(n){ n.classList.remove('sd-hidden'); });

    doc.querySelector('#nav').setAttribute('hidden', '');
    doc.querySelector('#navName').removeAttribute('value');
    doc.querySelector('#count').textContent = '';
    doc.querySelector('#hud').removeAttribute('class');
    doc.querySelector('#sd-arrangement').textContent = JSON.stringify(arr);
    var title = document.title + (name ? ' – ' + name : '');
    doc.querySelector('title').textContent = title;
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['<!doctype html>\n' + doc.outerHTML], { type: 'text/html' }));
    a.download = slug(title) + '.html';
    document.body.appendChild(a); a.click(); a.remove();

  }
  $('navBtn').onclick = function(){ toggleNav(); };
  $('navClose').onclick = function(){ toggleNav(false); };
  $('navAll').onclick = function(){ arr.hidden = []; rearranged(); };
  $('navReset').onclick = function(){
    try { localStorage.removeItem(storeKey); } catch (e) {}
    arr = normalize(fileArr) || { order: ids.slice(), hidden: [] }; rearranged();
  };
  $('navSave').onclick = saveCopy;

  /* ---- input ---- */
  var keys = { ArrowRight: next, ArrowDown: next, PageDown: next, ' ': next, Enter: next, ArrowLeft: prev, ArrowUp: prev, PageUp: prev, Backspace: prev,
    Home: function(){ go(0); }, End: function(){ go(seq.length - 1, true); }, f: fullscreen, F: fullscreen,
    s: function(){ toggleNav(); }, S: function(){ toggleNav(); } };
  addEventListener('keydown', function(e){
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Escape' && !nav.hidden){ e.preventDefault(); toggleNav(false); $('navBtn').focus(); return; }
    // typing in the name field, and Enter / Space on a button or checkbox, belong to that control
    var t = e.target, tag = t && t.tagName;
    if (tag === 'INPUT' && t.type === 'text') return;
    if ((tag === 'BUTTON' || tag === 'INPUT') && (e.key === 'Enter' || e.key === ' ')) return;
    var k = keys[e.key];
    if (k){ e.preventDefault(); k(); }
  });
  /* ---- free zoom and pan ---- */
  var MINW = 300, MAXW = 40000, ALL = { x: -300, y: -250, w: 8600, h: 5920 };
  function toWorld(cx, cy){ var m = svg.getScreenCTM(); if (!m) return { x: cam.x, y: cam.y }; var p = svg.createSVGPoint(); p.x = cx; p.y = cy; return p.matrixTransform(m.inverse()); }
  function zoomAt(cx, cy, k){

  }
  function zoomCenter(k){ zoomAt(innerWidth / 2, innerHeight / 2, k); }
  function fitSlide(){ if (seq[pos]) fly(frameView(seq[pos])); }
  function fitAll(){ var r = svg.getBoundingClientRect(), a = r.height / r.width, w = ALL.w, h = ALL.h;
    if (h / w < a) h = w * a; else w = h / a; fly({ x: ALL.x + ALL.w / 2 - w / 2, y: ALL.y + ALL.h / 2 - h / 2, w: w, h: h }); }
  $('zIn').onclick = function(){ zoomCenter(1 / 1.4); };
  $('zOut').onclick = function(){ zoomCenter(1.4); };
  $('zFit').onclick = fitSlide;
  $('zAll').onclick = fitAll;
  keys['+'] = keys['='] = function(){ zoomCenter(1 / 1.4); };
  keys['-'] = keys['_'] = function(){ zoomCenter(1.4); };
  keys['0'] = fitSlide; keys['1'] = fitAll;
  svg.addEventListener('wheel', function(e){
    e.preventDefault();

    try { svg.setPointerCapture(e.pointerId); } catch (_) {}

    if (p.length === 1){ down = { x: e.clientX, y: e.clientY, cam: cam, s: cam.w / svg.getBoundingClientRect().width }; moved = false; }

  });
  svg.addEventListener('pointermove', function(e){
    if (!ptrs[e.pointerId]) return;
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    var p = pts();
    if (pinch && p.length === 2){
      var d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      if (d > 0){ zoomAt((p[0].x + p[1].x) / 2, (p[0].y + p[1].y) / 2, pinch.d / d); pinch.d = d; }
      return;
    }
    if (!down) return;
    var dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (!moved && Math.abs(dx) + Math.abs(dy) < 6) return;
    if (!moved){ moved = true; cancelAnimationFrame(raf); document.body.classList.add('panning'); }
    var c = down.cam, s = Math.max(c.w / svg.getBoundingClientRect().width, c.h / svg.getBoundingClientRect().height);
    setCam({ x: c.x - dx * s, y: c.y - dy * s, w: c.w, h: c.h });
  });
  function endPtr(e){
    var was = ptrs[e.pointerId]; delete ptrs[e.pointerId];
    if (pts().length < 2) pinch = null;
    if (!was) return;
    document.body.classList.remove('panning');
    if (down && !moved && pts().length === 0) (e.clientX < innerWidth / 2 ? prev : next)();
    if (pts().length === 0) down = null;
  }
  svg.addEventListener('pointerup', endPtr);
  svg.addEventListener('pointercancel', function(e){ delete ptrs[e.pointerId]; pinch = null; down = null; document.body.classList.remove('panning'); });
  addEventListener('mousemove', showHud);

  rebuild();
  var start = parseInt((location.hash || '').slice(1), 10);
  go(start > 0 ? start - 1 : 0, false, true);
})();</script>
