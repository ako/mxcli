name: Nightly Release & Integration Tests

on:
  schedule:
    # Every day at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # `engines` is spelled out per entry rather than defaulted, so reading
        # this block tells you where legacy runs without also knowing what an
        # omitted key falls back to.
        include:
          - mendix-version: '10.24.24.119349'
            engines: modelsdk
          - mendix-version: '11.6.8'
            engines: modelsdk
          - mendix-version: '11.12.2'
            engines: modelsdk
          - mendix-version: '11.13.0'
            engines: modelsdk
          - mendix-version: '11.14.0'
            engines: all
      fail-fast: false
    name: test (Mendix ${{ matrix.mendix-version }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'

      - name: Cache ANTLR4 JAR
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/antlr/antlr4
          key: antlr4-4.13.2
      - name: Install ANTLR4
        run: pip install 'antlr4-tools==0.2.2'
      - name: Generate parser
        run: make grammar
        env:
          ANTLR4_TOOLS_ANTLR_VERSION: '4.13.2'
      - name: Build
        run: make build

      - name: Unit tests
        run: make test

      - name: Setup mxbuild ${{ matrix.mendix-version }}
        run: ./bin/mxcli setup mxbuild --version ${{ matrix.mendix-version }}

      # The nightly is where legacy is verified — the per-push job runs modelsdk
      # alone (push-test.yml) — but it no longer runs on every Mendix version.
      #
      # The engine matrix is most of what this step costs: each script is
      # executed and handed to mxbuild once PER ENGINE (measured 588s -> 232s
      # for modelsdk alone), so legacy was five sixths of the fleet's cost for a
      # path nothing routes to any more. As of 2026-09-12 no mxcli feature falls
      # back to it: the last four widget keywords are written by the codec engine
      # and the last two reachable unimplemented backend methods are implemented
      # (mdl/backend/modelsdk/unimplemented_reachability_test.go holds that
      # measurement). Legacy is now strictly weaker — rules, menus, layouts,
      # message definitions and regular expressions all refuse on it.
      #
      # It is narrowed rather than dropped, deliberately. `--engine legacy` is
      # still a thing a user can type, and an engine that ships untested rots
      # silently — the failure this repo has already had once (#808, an
      # integration test that had only ever skipped). One version keeps the
      # engine honest at a fifth of the cost; drop this line only together with
      # the engine itself.
      #
      # Legacy's UNIT tests are unaffected and still run on every push: what
      # narrows here is only the expensive exec + mxbuild loop.
      #
      # The engine set is in the step NAME as well as the env, because `go test`
      # without -v discards a passing package's output, so TestMain's own notice
      # never reaches a green log.
      - name: "Integration tests (Mendix ${{ matrix.mendix-version }}, engines: ${{ matrix.engines }})"
        run: make test-integration
        env:
          MXCLI_TEST_ENGINES: ${{ matrix.engines }}
        timeout-minutes: 30

  nightly:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'

      - uses: oven-sh/setup-bun@v2

      - name: Cache ANTLR4 JAR
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/antlr/antlr4
          key: antlr4-4.13.2
      - name: Install ANTLR4
        run: pip install 'antlr4-tools==0.2.2'
      - name: Generate parser
        run: make grammar
        env:
          ANTLR4_TOOLS_ANTLR_VERSION: '4.13.2'

      - name: Check for new commits since last nightly
        id: check
        run: |
          LAST_NIGHTLY=$(gh release view nightly --json publishedAt -q .publishedAt 2>/dev/null || echo "")
          if [ -n "$LAST_NIGHTLY" ]; then
            COMMITS=$(git log --since="$LAST_NIGHTLY" --oneline origin/main | wc -l)
            if [ "$COMMITS" -eq 0 ]; then
              echo "No new commits since last nightly, skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$COMMITS new commit(s) since last nightly."
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build release binaries
        if: steps.check.outputs.skip != 'true'
        run: VERSION=nightly-$(date -u +%Y%m%d)-$(git rev-parse --short HEAD) make release

      - name: Generate changelog
        if: steps.check.outputs.skip != 'true'
        id: changelog
        run: |
          {
            echo "body<<NIGHTLY_EOF"
            echo "**Nightly build from \`main\` — $(date -u +%Y-%m-%d)**"
            echo ""
            echo "Commit: [\`$(git rev-parse --short HEAD)\`](https://github.com/${{ github.repository }}/commit/$(git rev-parse HEAD))"
            echo ""
            echo "### Recent changes"
            echo ""
            git log --oneline -20 origin/main
            echo ""
            echo "> This is an automated pre-release build. Use tagged releases for production."
            echo "NIGHTLY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Delete previous nightly release
        if: steps.check.outputs.skip != 'true'
        run: gh release delete nightly --cleanup-tag -y 2>/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create nightly release
        if: steps.check.outputs.skip != 'true'
        # Pass the notes body via an env var, NOT via `${{ }}` interpolation into
        # the shell. Interpolating it directly lets the shell re-interpret the
        # body's backticks (command substitution) and double quotes (from commit
        # subjects in the git log), which broke the release step. `"$NOTES"` is
        # inert literal data.
        run: |
          gh release create nightly \
            --prerelease \
            --title "Nightly $(date -u +%Y-%m-%d)" \
            --notes "$NOTES" \
            bin/mxcli-*
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.changelog.outputs.body }}
